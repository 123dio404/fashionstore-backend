name: Backend tests (RNF11)

on:
  push:
    branches: [main, parcial-2, axel]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest · ventas offline, conflictos y aislamiento
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fashionstore
          POSTGRES_PASSWORD: fashionstore
          POSTGRES_DB: fashionstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fashionstore -d fashionstore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://fashionstore:fashionstore@localhost:5432/fashionstore_test
      ENVIRONMENT: test
      SEED_DEMO_USERS: "false"
      SEED_DEMO_CATALOG: "false"
      SEED_DEMO_PURCHASES: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas críticas
        run: python -m pytest -q
