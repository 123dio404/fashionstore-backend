services:
  db:
    image: postgres:16-alpine
    container_name: fashionstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fashionstore
      POSTGRES_PASSWORD: fashionstore
      POSTGRES_DB: fashionstore
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashionstore -d fashionstore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: